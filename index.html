<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다시, 나 - 김지은 포트폴리오</title>

    <!-- Google Fonts: Noto Sans KR 연결 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- 외부 CSS 스타일시트 연결 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 헤더 영역: 사이트 제목 및 메인 네비게이션 -->
    <header>
        <h1><strong>다시, 나</strong></h1>
        <nav>
            <ul>
                <li><a href="#about">소개</a></li>
                <li><a href="#experience">경력</a></li>
                <li><a href="#skills">역량</a></li>
                <li><a href="#education">교육·자격</a></li>
                <li><a href="#contact">문의</a></li>
            </ul>
        </nav>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main>
        <!-- 1. 소개 섹션 -->
        <section id="about">
            <h2>소개</h2>
            <p><strong>이름:</strong> 김지은</p>
            <p><strong>한 줄 소개:</strong> 10년 경력의 사무행정 전문가, 다시 시작합니다</p>
            <!-- 프로필 임시 이미지 -->
            <img src="https://placehold.co/300x300?text=Profile" alt="김지은 프로필 사진" width="300" height="300">
        </section>

        <!-- 2. 경력 섹션 -->
        <section id="experience">
            <h2>경력</h2>
            <p>사무행정 관련 주요 실무 경력 내용이 들어갈 자리입니다.</p>
            <!-- 경력 관련 임시 이미지 -->
            <img src="https://placehold.co/600x200?text=Experience" alt="경력 소개 이미지" width="600" height="200">
        </section>

        <!-- 3. 역량 섹션 -->
        <section id="skills">
            <h2>역량</h2>
            <p>문서 작성, 데이터 관리, 일정 조율 등 핵심 직무 역량이 들어갈 자리입니다.</p>
            <!-- 역량 관련 임시 이미지 -->
            <img src="https://placehold.co/600x200?text=Skills" alt="직무 역량 이미지" width="600" height="200">
        </section>

        <!-- 4. 교육 및 자격 섹션 -->
        <section id="education">
            <h2>교육·자격</h2>
            <p>취득 자격증 및 수료한 교육 과정 정보가 들어갈 자리입니다.</p>
            <!-- 자격 관련 임시 이미지 -->
            <img src="https://placehold.co/600x200?text=Education" alt="교육 및 자격 이미지" width="600" height="200">
        </section>

        <!-- 5. 문의 섹션 -->
        <section id="contact">
            <h2>문의</h2>
            <p>이메일, 연락처, 메시지 폼 등이 들어갈 자리입니다.</p>
            <!-- 문의 관련 임시 이미지 -->
            <img src="https://placehold.co/600x150?text=Contact" alt="문의 안내 이미지" width="600" height="150">
        </section>
    </main>

    <!-- 푸터 영역: 저작권 및 기본 안내 -->
    <footer>
        <p>&copy; 2026 김지은. All rights reserved.</p>
    </footer>

    <!-- 외부 JavaScript 파일 연결 -->
    <script src="js/script.js"></script>
</body>
</html>
